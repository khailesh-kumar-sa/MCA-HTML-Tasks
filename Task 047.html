<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Highlight Paragraph</title>

    <style>
        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>Interesting Technology Facts</h1>

    <p>
        Technology continues to change the way people communicate,
        learn, work, and solve everyday problems.
    </p>

    <p class="highlight">
        Artificial Intelligence is helping computers perform tasks
        that traditionally require human intelligence.
    </p>

</body>
</html>
