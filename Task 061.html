<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paragraph Styling</title>

    <style>
        p {
            font-size: 20px;
            line-height: 1.5;
            text-align: justify;
        }
    </style>
</head>

<body>

    <h1>Styled Paragraph</h1>

    <p>
        This paragraph demonstrates the use of font size, line height,
        and text alignment in CSS. The font size is set to 20 pixels,
        the line height is set to 1.5 for better readability, and the
        text is justified so that the content aligns evenly on both the
        left and right sides.
    </p>

</body>

</html>
