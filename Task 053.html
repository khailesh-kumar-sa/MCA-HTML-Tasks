<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Button Styling</title>

    <style>
        .common-button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        #special-button {
            background-color: red;
            color: white;
            padding: 15px 25px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>Styled Buttons</h1>

    <button class="common-button">Button 1</button>

    <button class="common-button">Button 2</button>

    <button id="special-button">Button 3</button>

</body>

</html>
