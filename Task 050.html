<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Paragraph Colors</title>

    <style>
        p {
            color: blue;
        }

        p:nth-child(2) {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Paragraph Styling</h1>

    <p>This is the first paragraph. It is displayed in blue.</p>

    <p>This is the second paragraph. It is displayed in red.</p>

    <p>This is the third paragraph. It is displayed in blue.</p>

</body>

</html>
