<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three Colored Boxes</title>

    <style>
        .box {
            width: 200px;
            height: 150px;
            margin: 15px;
            display: inline-block;
            text-align: center;
            padding-top: 60px;
            box-sizing: border-box;
        }

        .box1 {
            background-color: red;
        }

        .box2 {
            background-color: blue;
        }

        .box3 {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>Three Colored Boxes</h1>

    <div class="box box1">Red Box</div>

    <div class="box box2">Blue Box</div>

    <div class="box box3">Green Box</div>

</body>

</html>
