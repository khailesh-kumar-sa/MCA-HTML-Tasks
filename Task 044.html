<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paragraph Font Size</title>

    <style>
        p {
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Ocean Exploration</h1>

    <p>
        The ocean covers a large part of our planet and contains
        thousands of fascinating marine species.
    </p>

    <p>
        Scientists continue to explore the deep sea to understand
        its ecosystems and discover new forms of life.
    </p>

</body>
</html>
