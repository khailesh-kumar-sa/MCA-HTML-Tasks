<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradient Background</title>

    <style>
        .gradient-section {
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <section class="gradient-section">

        <h1>Gradient Background</h1>

        <p>
            This section uses a linear gradient background that smoothly
            changes from blue to purple.
        </p>

    </section>

</body>

</html>
