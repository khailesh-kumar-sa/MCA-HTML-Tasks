<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box Border</title>

    <style>
        .box {
            border: 1px solid black;
            padding: 20px;
            width: 300px;
        }
    </style>
</head>

<body>

    <h1>Space Exploration</h1>

    <p>
        Scientists continue to explore planets, stars, and distant
        galaxies to understand more about the universe.
    </p>

    <div class="box">
        <h2>Did You Know?</h2>

        <p>
            A day on Venus is longer than a year on Venus.
        </p>
    </div>

</body>
</html>
