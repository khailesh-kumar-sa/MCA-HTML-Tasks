<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Example</title>

    <style>
        .card {
            width: 300px;
            height: 200px;
            padding: 20px;
            margin: 10px;
            background-color: lightblue;
            border: 2px solid blue;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>My Card</h2>

        <p>
            This card has a width of 300px, height of 200px,
            padding of 20px, and margin of 10px.
        </p>
    </div>

</body>

</html>
