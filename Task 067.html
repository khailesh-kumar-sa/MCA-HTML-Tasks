<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b1b2f;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: #252545;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #00d9ff;
        }

        h2 {
            color: #ffcc00;
        }

        p {
            color: #d6d6d6;
            line-height: 1.6;
        }

        /* Button styling */
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: #00d9ff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00a8cc;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Gaming Hub</h1>

        <p>
            Welcome to the Gaming Hub, where players can discover
            exciting games, competitive challenges, and the latest
            developments in the gaming world.
        </p>

        <h2>Featured Game</h2>

        <p>
            Explore new adventures, complete challenging missions,
            and compete with players around the world.
        </p>

        <button>Start Playing</button>

    </div>

</body>
</html>
