<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>

    <style>
        .profile-card {
            width: 300px;
            padding: 20px;
            background-color: lightblue;
            color: black;
            border: 3px solid blue;
            text-align: center;
        }

        .profile-card h2 {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <h2>Khailesh Kumar</h2>

        <p>MCA Student</p>

        <p>Cybersecurity Enthusiast</p>

        <p>Founder of White Devils Tech</p>

    </div>

</body>

</html>
