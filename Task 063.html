<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>First Letter Styling</title>

    <style>
        p {
            font-size: 20px;
            line-height: 1.5;
        }

        p::first-letter {
            font-size: 50px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>First Letter Styling</h1>

    <p>
        This paragraph demonstrates how the first letter can be styled
        differently from the remaining text using the CSS ::first-letter
        pseudo-element.
    </p>

</body>

</html>
