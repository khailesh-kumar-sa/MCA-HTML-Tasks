<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        main {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        hr {
            border: none;
            border-top: 2px solid #ddd;
            margin: 30px 0;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main>
        <h1>Welcome to My Webpage</h1>

        <p>
            This is the first paragraph of my webpage. HTML is used
            to structure content on the web.
        </p>

        <p>
            This is the second paragraph. With a little CSS styling,
            we can make a simple webpage look clean and attractive.
        </p>

        <hr>

        <footer>
            &copy; 2026 My Webpage. All Rights Reserved.
        </footer>
    </main>

</body>
</html>
