<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Even List Items</title>

    <style>
        li:nth-child(even) {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>My List</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
        <li>PHP</li>
    </ul>

</body>

</html>
