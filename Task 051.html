<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Different Heading Styles</title>

    <style>
        .heading1 {
            color: red;
            font-size: 30px;
        }

        .heading2 {
            color: blue;
            font-style: italic;
        }

        .heading3 {
            color: green;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div>
        <h1 class="heading1">First Heading</h1>

        <h2 class="heading2">Second Heading</h2>

        <h3 class="heading3">Third Heading</h3>
    </div>

</body>

</html>
